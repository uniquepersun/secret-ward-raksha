# Privacy policy (read by main.py as simple "key: value" lines). Every value is justified by tools/attacker_sim.py
# measurements in SCORES.md: wider/removed quasi-identifiers cut re-identification sharply while the clinical
# values (drugs, doses, labs, diagnoses, stay length) are never touched.
age_band_years: 10         # truthful bands that always contain the real age (5-year bands re-identified 71% of patients, 10-year 33%)
age_topcode: 75            # open-ended "75+" band: the very old are unique in a small area
date_shift_max_days: 365   # every date of one patient moves by the same secret HMAC offset (stay lengths stay exact)
date_shift_min_days: 90    # never less than ~3 months, so the visit month and usually the year an attacker may know no longer match
rare_dx_max_patients: 1    # a condition held by at most this many patients is generalised away for them (it singles them out)
tehsil_level: 0            # 1 keeps the tehsil, 0 generalises location to district only
pin_digits: 0              # digits of the PIN code kept (6-digit PINs are always removed); 0 drops it
min_group_size: 5          # reserved for rare-combination suppression
time_budget_s: 540      # past this the remaining files are quarantined (reason time_budget_exceeded) so the run always finishes
span_timeout_s: 20     # hard wall-clock cap for one scan of one text (a crafted input cannot stall the run)
regex_timeout_s: 5      # per regex call; interrupts the matching engine itself (signals cannot)
